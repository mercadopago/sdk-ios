version: 2.1

executors:
  ios-executor:
    macos:
      xcode: "16.0.0"

jobs:
  build-and-test:
    executor: ios-executor
    steps:
      - checkout
      - run:
        name: Configure Ruby
        command: |
          echo 'export LANG=en_US.UTF-8' >> $BASH_ENV
          echo 'export LC_ALL=en_US.UTF-8' >> $BASH_ENV
          gem install bundler
          bundle install
      - run:
          name: Install Dependencies
          command: |
            make setup
      - run:
          name: Run SwiftLint
          command: swiftlint
      - run:
          name: Run SwiftFormat
          command: make format
      - run:
          name: Execute test and test coverage
          command: |
            bundle exec fastlane test
      - store_test_results:
          path: fastlane/test_output
          
      - store_artifacts:
          path: fastlane/test_output
          destination: test-result
      - store_artifacts:
          path: fastlane/coverage_output
          destination: code-coverage
workflows:
  version: 2
  build-test:
    jobs:
      - build-and-test